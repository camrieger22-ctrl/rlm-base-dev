<template>
    <div class="suite">
        <header class="suite-header">
            <div class="header-left">
                <button class="linkish" type="button" onclick={handleBackToOpp}>
                    ← Back to opportunity
                </button>
                <div class="titles">
                    <h1 class="title" title={headerPrimary}>{headerPrimary}</h1>
                    <p class="subtitle" if:true={headerSecondary} title={headerSecondary}>
                        {headerSecondary}
                    </p>
                </div>
            </div>
            <div class="header-brand">
                <img class="wordmark" src={wordmarkUrl} alt="BambooHR" />
                <span class="suite-name">Revenue Suite</span>
            </div>
            <div class="header-actions">
                <button
                    class="btn ghost"
                    type="button"
                    onclick={handleToggleCompare}
                    disabled={compareDisabled}
                    title="Full-width side-by-side compare"
                >
                    {compareToggleLabel}
                </button>
                <button
                    class="btn ghost"
                    type="button"
                    onclick={handlePreview}
                    disabled={previewDisabled}
                    title="Generate proposal PDF for the active option"
                >
                    {previewButtonLabel}
                </button>
                <button
                    class="btn ghost"
                    type="button"
                    onclick={handleToggleSend}
                    disabled={sendDisabled}
                    title="Email this option to an Opportunity contact (PDF optional)"
                >
                    {sendButtonLabel}
                </button>
                <button
                    class="btn ghost"
                    type="button"
                    onclick={handleTogglePendingApprovals}
                    disabled={pendingApprovalsButtonDisabled}
                    title="Review and approve Smart Approval work items for the active option"
                >
                    {pendingApprovalsButtonLabel}
                </button>
                <span class="save-chip">{saveLabel}</span>
                <button
                    class="btn agent"
                    type="button"
                    onclick={handleToggleAgent}
                    aria-pressed={agentOpen}
                >
                    Agent
                </button>
            </div>
        </header>
        <div class="error header-error" role="alert" if:true={previewError}>{previewError}</div>
        <div class="error header-error" role="alert" if:true={sendError}>{sendError}</div>
        <p class="agent-status" if:true={sendStatusMsg} aria-live="polite">{sendStatusMsg}</p>
        <div class="send-panel" if:true={sendOpen}>
            <div class="send-row">
                <label class="ribbon-label" for="send-contact">Contact</label>
                <select
                    id="send-contact"
                    class="send-select"
                    value={sendContactId}
                    onchange={handleSendContactChange}
                    disabled={sendBusy}
                >
                    <option value="">Select a contact…</option>
                    <template for:each={sendContactOptions} for:item="c">
                        <option key={c.contactId} value={c.contactId}>{c.label}</option>
                    </template>
                </select>
            </div>
            <div class="send-row">
                <label class="ribbon-label" for="send-to">To override</label>
                <input
                    id="send-to"
                    class="send-input"
                    type="email"
                    placeholder="optional@email.com"
                    value={sendToAddress}
                    onchange={handleSendToAddressChange}
                    disabled={sendBusy}
                />
            </div>
            <label class="send-check">
                <input
                    type="checkbox"
                    checked={sendAttachPdf}
                    onchange={handleSendAttachPdfChange}
                    disabled={sendBusy}
                />
                Attach proposal PDF
            </label>
            <button
                class="btn add small"
                type="button"
                onclick={handleSendToCustomer}
                disabled={sendBusy}
            >
                {sendBusy ? 'Sending…' : 'Send email'}
            </button>
        </div>

        <div class="approvals-panel" if:true={approvalsOpen}>
            <div class="approvals-head">
                <div>
                    <h2 class="approvals-title">Pending approvals</h2>
                    <p class="hint approvals-hint">
                        Prefer the Quote
                        <button
                            type="button"
                            class="link-btn"
                            onclick={handleOpenQuoteApprovals}
                            disabled={approvalReviewBusy}
                        >
                            Approvals tab / Work Guide
                        </button>
                        for Manager → Director → VP. This panel lists Assigned steps for
                        convenience. Reject names which line(s) to fix; the AE edits and
                        resubmits.
                    </p>
                    <p class="hint" if:true={pendingWorkGuideHint}>{pendingWorkGuideHint}</p>
                </div>
                <div class="approvals-head-actions">
                    <template if:true={showOpenQuoteApprovals}>
                        <button
                            class="btn ghost small"
                            type="button"
                            onclick={handleOpenQuoteApprovals}
                            disabled={approvalReviewBusy}
                            title="Open this option Quote for Approvals / Work Guide"
                        >
                            Open on Quote
                        </button>
                    </template>
                    <button
                        class="btn ghost small"
                        type="button"
                        onclick={handleTogglePendingApprovals}
                        disabled={approvalReviewBusy}
                    >
                        Close
                    </button>
                </div>
            </div>
            <template if:true={pendingApprovalsLoading}>
                <p class="hint">Loading approval steps…</p>
            </template>
            <div class="error" role="alert" if:true={pendingApprovalsError}>
                {pendingApprovalsError}
            </div>
            <template if:false={pendingApprovalsLoading}>
                <div class="approvals-request" if:true={hasPendingRequestSummary}>
                    <p class="approvals-request-label">What is being requested</p>
                    <pre class="approvals-request-body">{pendingRequestSummary}</pre>
                </div>
                <div
                    class="approvals-advancing"
                    if:true={showPendingApprovalsAdvancing}
                    role="status"
                    aria-live="polite"
                >
                    <span class="approvals-advancing-spinner" aria-hidden="true"></span>
                    <p class="approvals-advancing-text">
                        Step approved — loading {pendingApprovalsAdvancingLabel}…
                    </p>
                    <p class="hint approvals-advancing-hint">
                        The next approver is assigned by Smart Approval. This usually takes a few
                        seconds.
                    </p>
                </div>
                <template if:false={hasPendingApprovalItems}>
                    <p class="hint" if:false={showPendingApprovalsAdvancing}>
                        No assigned approval steps on this option. Submit for approval after
                        Commit, then refresh if you expect Manager/Director/VP steps.
                    </p>
                </template>
                <ul class="approvals-list" if:true={hasPendingApprovalItems}>
                    <template for:each={pendingApprovalRows} for:item="row">
                        <li key={row.workItemId} class="approvals-item">
                            <div class="approvals-item-main">
                                <strong>{row.stepName}</strong>
                                <span class="muted">{row.chainLabel}</span>
                                <span class="approvals-assignee"
                                    >Assigned to {row.assignedLabel}</span
                                >
                            </div>
                            <template if:true={row.canAct}>
                                <label class="approvals-comment-label">Comments</label>
                                <textarea
                                    class="approvals-comment"
                                    rows="2"
                                    placeholder="Reject requires: e.g. Reject Payroll @ 50%. Keep Core @ 25%."
                                    value={approvalReviewComment}
                                    onchange={handleApprovalReviewCommentChange}
                                    disabled={row.reviewBusy}
                                ></textarea>
                                <p class="hint approvals-reject-hint">
                                    Reject ends the whole submission (not one line). Name the
                                    failing product/Disc % so the AE can edit and resubmit.
                                </p>
                                <div class="approvals-actions">
                                    <button
                                        class="btn add small"
                                        type="button"
                                        data-work-item-id={row.workItemId}
                                        data-decision="approve"
                                        onclick={handleReviewWorkItem}
                                        disabled={approvalReviewBusy}
                                    >
                                        {row.reviewBusy ? 'Working…' : 'Approve'}
                                    </button>
                                    <button
                                        class="btn ghost small approvals-reject"
                                        type="button"
                                        data-work-item-id={row.workItemId}
                                        data-decision="reject"
                                        onclick={handleReviewWorkItem}
                                        disabled={approvalReviewBusy}
                                    >
                                        Reject
                                    </button>
                                </div>
                            </template>
                            <p class="hint approvals-waiting" if:true={row.showWaiting}>
                                Waiting on {row.assignedLabel}. You are not in that assignee
                                group/role, so Approve/Reject stay on the assignee.
                            </p>
                        </li>
                    </template>
                </ul>
                <div class="approvals-recall" if:true={showRecallApproval}>
                    <button
                        class="btn ghost small"
                        type="button"
                        onclick={handleRecallApproval}
                        disabled={approvalReviewBusy}
                        title="Recall the open Smart Approval submission"
                    >
                        Recall approval
                    </button>
                </div>
            </template>
        </div>

        <div class="term-ribbon">
            <div class="term-block term-start">
                <label class="ribbon-label" for="term-start">Term start</label>
                <input
                    id="term-start"
                    class="term-date"
                    type="date"
                    value={termStartDate}
                    onchange={handleTermStartChange}
                    disabled={termControlsDisabled}
                />
            </div>
            <div class="pill-row" role="group" aria-label="Term length">
                <template for:each={termPills} for:item="t">
                    <button
                        key={t.value}
                        type="button"
                        class={t.className}
                        data-value={t.value}
                        onclick={handleTerm}
                        disabled={t.disabled}
                    >
                        {t.label}
                    </button>
                </template>
            </div>
            <div class="term-block term-end">
                <span class="ribbon-label">End</span>
                <span class="ribbon-value ribbon-end">{termEndDisplay}</span>
            </div>
            <div class="term-block ribbon-hint-block">
                <span class="ribbon-label ribbon-label-spacer" aria-hidden="true">&nbsp;</span>
                <p class="ribbon-hint">{ribbonHintLabel}</p>
            </div>
            <div class="billing-block">
                <span class="ribbon-label">Billing</span>
                <div class="pill-row" role="group" aria-label="Billing frequency">
                    <template for:each={billingPills} for:item="b">
                        <button
                            key={b.value}
                            type="button"
                            class={b.className}
                            data-value={b.value}
                            onclick={handleBilling}
                            disabled={b.disabled}
                        >
                            {b.label}
                        </button>
                    </template>
                </div>
            </div>
            <div class="discount-block">
                <span class="ribbon-label">Discount</span>
                <div class="discount-ribbon-control">
                    <input
                        class="term-date discount-ribbon-input"
                        type="number"
                        min="0"
                        max="100"
                        step="0.1"
                        aria-label="Blanket discount percent applied to every line of every option"
                        value={allOptionsDiscountPercent}
                        oninput={handleAllOptionsDiscountInput}
                        disabled={ribbonDiscountDisabled}
                    />
                    <span class="discount-ribbon-suffix">%</span>
                    <button
                        type="button"
                        class="btn add small apply-all-disc-btn"
                        onclick={applyDiscountToAllOptions}
                        disabled={ribbonDiscountDisabled}
                        title="Apply this discount to every line of every option"
                    >
                        {applyAllOptionsDiscountLabel}
                    </button>
                </div>
            </div>
        </div>

        <!-- Full-bleed compare: replaces the 3-column workspace -->
        <section class="compare-stage" if:true={showCompare}>
            <div class="compare-toolbar">
                <div>
                    <h2 class="compare-title">Compare options</h2>
                    <p class="hint">Side-by-side term, billing, grand total, and run-rate metrics. Open an option to edit lines.</p>
                </div>
                <div class="options-bar-actions">
                    <button
                        class="btn ghost"
                        type="button"
                        onclick={handleToggleCompare}
                    >
                        ← Back to edit
                    </button>
                    <button
                        class="btn ghost"
                        type="button"
                        onclick={handleAddOption}
                        disabled={addOptionDisabled}
                    >
                        + Add option
                    </button>
                </div>
            </div>

            <template if:true={compareLoading}>
                <p class="hint compare-loading">Loading option details…</p>
            </template>
            <template if:true={compareError}>
                <div class="error" role="alert">{compareError}</div>
            </template>

            <div class={compareBoardClass} if:false={compareLoading}>
                <template for:each={compareColumns} for:item="col">
                    <article key={col.quoteId} class={col.panelClass}>
                        <header class="compare-panel-head">
                            <div>
                                <h3>{col.optionLabel}</h3>
                                <div class="chips">
                                    <span class={col.approvalClass}>{col.approvalLabel}</span>
                                    <span class={col.pricedClass}>{col.pricedLabel}</span>
                                    <span class="chip chip-synced" if:true={col.syncedToOpportunity}
                                        >On Opportunity</span
                                    >
                                </div>
                            </div>
                            <button
                                class="btn add compare-edit"
                                type="button"
                                data-quote-id={col.quoteId}
                                onclick={handleSelectOption}
                            >
                                Open
                            </button>
                        </header>

                        <div class="compare-terms">
                            <div>
                                <span class="metric-label">Term</span>
                                <span class="compare-term-value">{col.termLabel}</span>
                                <span class="compare-term-dates muted" if:true={col.hasTermDates}
                                    >{col.termDatesLabel}</span
                                >
                            </div>
                            <div>
                                <span class="metric-label">Billing</span>
                                <span class="compare-term-value">{col.billingLabel}</span>
                            </div>
                            <div>
                                <span class="metric-label">Grand total</span>
                                <span class="compare-term-value compare-grand-total"
                                    >{col.grandTotalLabel}</span
                                >
                            </div>
                        </div>

                        <div class="compare-metrics">
                            <div>
                                <span class="metric-label">MRR</span>
                                <span class="compare-metric-value">{col.mrrLabel}</span>
                            </div>
                            <div>
                                <span class="metric-label">ARR</span>
                                <span class="compare-metric-value">{col.arrLabel}</span>
                            </div>
                        </div>

                        <p class="compare-line-count">{col.lineCount} products</p>

                        <template if:false={col.hasLines}>
                            <p class="empty-lines">No lines yet.</p>
                        </template>
                        <ul class="compare-lines" if:true={col.hasLines}>
                            <template for:each={col.lines} for:item="line">
                                <li key={line.lineId} class={line.rowClass}>
                                    <div class="compare-line-name">
                                        <strong>{line.name}</strong>
                                        <span class="muted">{line.sku}</span>
                                    </div>
                                    <div class="compare-line-meta">
                                        <span>{line.qtyLabel} × {line.unitLabel}</span>
                                        <span class="line-net">{line.netLabel}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>

                        <footer class="compare-foot">
                            <span class="compare-foot-grand">{col.grandTotalLabel}</span>
                            <span class="compare-foot-meta"
                                >{col.termLabel} · {col.billingLabel} · {col.mrrLabel}/mo MRR</span
                            >
                        </footer>
                    </article>
                </template>
            </div>
        </section>

        <div class={bodyClass} if:true={showEditWorkspace}>
            <aside class="col catalog">
                <h2 class="col-title">Products</h2>
                <input
                    class="search"
                    type="search"
                    placeholder="Search products"
                    value={searchText}
                    oninput={handleSearch}
                />
                <p class="catalog-selection-hint hint" if:true={hasCatalogQueue}>
                    {catalogSelectionHint}
                </p>
                <template if:true={catalogError}>
                    <div class="error" role="alert">{catalogError}</div>
                </template>
                <template if:true={frequentProducts.length}>
                    <p class="section-label">Frequent</p>
                    <div class="frequent-grid">
                        <template for:each={frequentProducts} for:item="fp">
                            <button
                                key={fp.sku}
                                type="button"
                                class={fp.className}
                                data-sku={fp.sku}
                                onclick={handleSelectProduct}
                            >
                                {fp.name}
                            </button>
                        </template>
                    </div>
                </template>
                <p class="section-label">All products</p>
                <ul class="prod-list">
                    <template for:each={filteredProducts} for:item="p">
                        <li key={p.sku} class={p.rowClass}>
                            <label class="prod-check">
                                <input
                                    type="checkbox"
                                    checked={p.checked}
                                    data-sku={p.sku}
                                    onchange={handleToggleCatalogSku}
                                />
                                <span class="sr-only">Select {p.name}</span>
                            </label>
                            <button
                                type="button"
                                class={p.className}
                                data-sku={p.sku}
                                onclick={handleSelectProduct}
                            >
                                <span class="prod-name">{p.name}</span>
                                <span class="badge">{p.badge}</span>
                                <span class="prod-price">{p.priceLabel}</span>
                            </button>
                        </li>
                    </template>
                </ul>
            </aside>

            <main class="col configure" if:true={hasSelection}>
                <button
                    class="config-dismiss"
                    type="button"
                    title="Close configuration"
                    aria-label="Close configuration"
                    onclick={handleClearSelection}
                >
                    ×
                </button>
                <h2 class="config-product-name">{configureHeading}</h2>
                <p class="hint" if:true={configureHint}>{configureHint}</p>
                <div class="config-queue" if:true={hasCatalogMultiSelect}>
                    <div class="config-queue-head">
                        <p class="field-label config-queue-label">Products to add</p>
                        <button
                            class="linkish config-queue-clear"
                            type="button"
                            onclick={handleClearSelection}
                        >
                            Clear all
                        </button>
                    </div>
                    <ul class="config-queue-list config-queue-rows" aria-label="Products to add">
                        <template for:each={catalogQueuedProducts} for:item="item">
                            <li key={item.sku} class="config-queue-row">
                                <div class="config-queue-row-id">
                                    <span class="config-queue-chip-name">{item.name}</span>
                                    <span class="config-queue-chip-sku muted">{item.sku}</span>
                                </div>
                                <div class="catalog-queue-qty" role="group" aria-label="Quantity">
                                    <button
                                        class="qty-btn qty-btn-sm"
                                        type="button"
                                        data-sku={item.sku}
                                        data-delta="-1"
                                        onclick={handleQueueQtyStep}
                                        disabled={item.qtyLessEqualOne}
                                        aria-label="Decrease quantity"
                                    >
                                        −
                                    </button>
                                    <input
                                        class="catalog-queue-qty-input"
                                        type="number"
                                        min="1"
                                        data-sku={item.sku}
                                        value={item.quantity}
                                        onchange={handleQueueQtyInput}
                                        aria-label="Quantity"
                                    />
                                    <button
                                        class="qty-btn qty-btn-sm"
                                        type="button"
                                        data-sku={item.sku}
                                        data-delta="1"
                                        onclick={handleQueueQtyStep}
                                        aria-label="Increase quantity"
                                    >
                                        +
                                    </button>
                                </div>
                                <span class="config-queue-row-list">{item.lineListLabel}</span>
                                <button
                                    class="config-queue-chip-remove"
                                    type="button"
                                    data-sku={item.sku}
                                    title="Remove from queue"
                                    aria-label="Remove from queue"
                                    onclick={handleRemoveFromQueue}
                                >
                                    ×
                                </button>
                            </li>
                        </template>
                    </ul>
                    <div class="catalog-queue-apply">
                        <span class="catalog-queue-apply-label">Set all to</span>
                        <template for:each={qtyPresets} for:item="q">
                            <button
                                key={q}
                                type="button"
                                class="pill pill-sm"
                                data-qty={q}
                                onclick={handleApplyQtyToAll}
                            >
                                {q}
                            </button>
                        </template>
                    </div>
                </div>
                <template if:false={hasCatalogMultiSelect}>
                    <template if:true={selectedProduct.description}>
                        <p class="config-desc">{selectedProduct.description}</p>
                    </template>
                </template>
                <template if:true={isWorkforcePackageSelected}>
                    <p class="field-label">Base plan</p>
                    <div class="pill-row" role="group" aria-label="Workforce base plan">
                        <template for:each={workforcePlanPills} for:item="p">
                            <button
                                key={p.value}
                                type="button"
                                class={p.className}
                                data-value={p.value}
                                title={p.title}
                                onclick={handlePackagePlan}
                                disabled={p.disabled}
                            >
                                {p.label}
                            </button>
                        </template>
                    </div>
                    <p class="hint package-addons-hint">
                        Includes Payroll + Benefits (required). Bundle &amp; Save
                        applies on add-ons. Base plan expands as Pro (catalog
                        default); Core/Elite under this package need configurator
                        selection next.
                    </p>
                </template>
                <template if:true={showSharedQuantity}>
                    <label class="field-label" for="qty">Quantity</label>
                    <div class="qty-stepper">
                        <button
                            class="qty-btn"
                            type="button"
                            data-delta="-1"
                            onclick={handleQtyStep}
                            disabled={quantityLessEqualOne}
                        >
                            −
                        </button>
                        <input
                            id="qty"
                            class="qty"
                            type="number"
                            min="1"
                            value={quantity}
                            onchange={handleQtyInput}
                        />
                        <button class="qty-btn" type="button" data-delta="1" onclick={handleQtyStep}>
                            +
                        </button>
                    </div>
                    <div class="pill-row qty-presets">
                        <template for:each={qtyPresets} for:item="q">
                            <button
                                key={q}
                                type="button"
                                class="pill"
                                data-qty={q}
                                onclick={handleQtyPreset}
                            >
                                {q}
                            </button>
                        </template>
                    </div>
                </template>
                <p class="price-line">{configPriceLabel}</p>
                <template if:false={estimateDisabled}>
                    <p class="price-line estimate-link-row">
                        <button
                            type="button"
                            class="link-btn"
                            onclick={handleEstimateCatalog}
                            disabled={estimateBusy}
                            title="Preview RC headless pricing before adding lines"
                        >
                            {estimatePreviewLinkLabel}
                        </button>
                        <template if:true={showEstimatePreview}>
                            <button
                                type="button"
                                class="link-btn subtle"
                                onclick={handleHideEstimatePreview}
                            >
                                Hide
                            </button>
                        </template>
                    </p>
                </template>
                <template if:true={showEstimatePreview}>
                    <template if:true={estimateBusy}>
                        <p class="price-line estimate-summary">Running RC pricing preview…</p>
                    </template>
                    <template if:true={estimateSummaryLabel}>
                        <p class="price-line estimate-summary">{estimateSummaryLabel}</p>
                    </template>
                    <template if:true={hasEstimateLines}>
                        <ul class="estimate-lines">
                            <template for:each={estimateLineRows} for:item="est">
                                <li key={est.sku} class="estimate-line">
                                    <span class="estimate-name">{est.name}</span>
                                    <span class="estimate-net"
                                        >{est.netUnitLabel} × {est.quantity} =
                                        {est.netTotalLabel}/mo</span
                                    >
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template if:true={estimateError}>
                        <div class="error" role="alert">{estimateError}</div>
                    </template>
                </template>
                <template if:true={addError}>
                    <div class="error" role="alert">{addError}</div>
                </template>
                <div class="catalog-actions">
                    <button
                        class="btn add"
                        type="button"
                        onclick={handleAddToOption}
                        disabled={addDisabled}
                    >
                        {addButtonLabel}
                    </button>
                </div>
            </main>

            <section class="col options">
                <div class="options-bar">
                    <h2 class="col-title">Quote options</h2>
                    <div class="options-bar-actions">
                        <button
                            class="btn ghost small"
                            type="button"
                            onclick={handleAddOption}
                            disabled={addOptionDisabled}
                        >
                            + Add option
                        </button>
                    </div>
                </div>
                <template if:true={optionsError}>
                    <div class="error" role="alert">{optionsError}</div>
                </template>

                <div class="option-tabs" if:true={optionCards.length}>
                    <template for:each={optionCards} for:item="tab">
                        <button
                            key={tab.quoteId}
                            type="button"
                            class={tab.cardClass}
                            data-quote-id={tab.quoteId}
                            onclick={handleSelectOption}
                        >
                            <span class="tab-label">{tab.optionLabel}</span>
                            <span class={tab.approvalClass}>{tab.approvalLabel}</span>
                            <span class="tab-mrr">{tab.mrrLabel}</span>
                            <span class="tab-grand-total">{tab.grandTotalLabel}</span>
                            <span class="tab-synced" if:true={tab.syncedToOpportunity}
                                >On Opportunity</span
                            >
                        </button>
                    </template>
                </div>

                <article class="option-card option-card-detail">
                    <header class="option-head">
                        <div class="option-head-main">
                            <h3>{optionLabel}</h3>
                            <div class="chips">
                                <span class={approvalChipClass}>{approvalChipLabel}</span>
                                <span
                                    class="chip approval-required-chip"
                                    if:true={showApprovalRequiredHint}
                                    title="Discount ladder requires these approvers on Submit"
                                    >{approvalRequiredChipLabel}</span
                                >
                                <span class={pricingChipClass}>{pricingChipLabel}</span>
                                <span class="chip chip-synced" if:true={activeOptionSynced}
                                    >On Opportunity</span
                                >
                            </div>
                        </div>
                        <div class="option-sync-actions">
                            <button
                                class="btn ghost small"
                                type="button"
                                onclick={handleSubmitForApproval}
                                disabled={submitApprovalDisabled}
                                title="Submit this option to Smart Approval"
                            >
                                {submitApprovalLabel}
                            </button>
                            <button
                                class="btn ghost small approvals-reject"
                                type="button"
                                onclick={handleRecallApproval}
                                disabled={approvalReviewBusy}
                                if:true={showRecallApproval}
                                title="Recall the open Smart Approval submission"
                            >
                                Recall
                            </button>
                            <button
                                class="btn ghost small"
                                type="button"
                                onclick={handleUnsyncOpportunity}
                                disabled={syncDisabled}
                                title={syncButtonTitle}
                                if:true={showStopSync}
                            >
                                Stop sync
                            </button>
                            <button
                                class="btn add small"
                                type="button"
                                onclick={handleSyncToOpportunity}
                                disabled={syncDisabled}
                                title={syncButtonTitle}
                                if:false={showStopSync}
                            >
                                Use for Opportunity
                            </button>
                        </div>
                    </header>
                    <div class="error" role="alert" if:true={syncError}>{syncError}</div>
                    <div class="error" role="alert" if:true={approvalError}>{approvalError}</div>
                    <p class="agent-status" if:true={approvalStatusMsg} aria-live="polite">
                        {approvalStatusMsg}
                    </p>
                    <p class="hint option-lock-hint" if:true={isOptionLocked}>{optionLockHint}</p>
                    <div
                        class="option-resubmit-guidance"
                        if:true={showResubmitGuidance}
                        role="status"
                    >
                        <p class="option-resubmit-title">{resubmitGuidanceTitle}</p>
                        <p class="hint option-resubmit-body">{resubmitGuidanceBody}</p>
                        <pre
                            class="option-resubmit-comments"
                            if:true={hasLastDecisionComments}
                        >{lastDecisionComments}</pre>
                    </div>
                    <div class="metrics">
                        <div><span class="metric-label">MRR</span> {mrrLabel}</div>
                        <div><span class="metric-label">ARR</span> {arrLabel}</div>
                        <div><span class="metric-label">Grand total</span> {grandTotalLabel}</div>
                    </div>
                    <div class="option-term-block">
                        <div class="option-term-row">
                            <span class="option-term-label">Term</span>
                            <span class={optionTermScopeClass}>{optionTermScopeLabel}</span>
                            <span class="option-term-range">{optionTermRangeLabel}</span>
                            <button
                                class="btn-term-action"
                                type="button"
                                onclick={handleOverrideTerm}
                                disabled={termControlsDisabled}
                                if:true={isActiveTermShared}
                                title="Set a custom term for this option only"
                            >
                                Customize term
                            </button>
                            <button
                                class="btn-term-action btn-term-action-muted"
                                type="button"
                                onclick={handleUseSharedTerm}
                                disabled={termControlsDisabled}
                                if:true={isActiveTermCustom}
                                title="Reset this option to the shared ribbon term"
                            >
                                Use shared term
                            </button>
                        </div>
                        <p class="option-term-hint" if:true={isActiveTermShared}>
                            Matches the ribbon. Customize to give this option its own dates.
                        </p>
                        <div class="option-local-term" if:true={isActiveTermCustom}>
                            <div class="term-block term-start">
                                <label class="ribbon-label" for="option-term-start">Start</label>
                                <input
                                    id="option-term-start"
                                    class="term-date"
                                    type="date"
                                    value={effectiveTermStart}
                                    onchange={handleOptionLocalTermStartChange}
                                    disabled={termControlsDisabled}
                                />
                            </div>
                            <div class="pill-row" role="group" aria-label="Option term length">
                                <template for:each={optionLocalTermPills} for:item="t">
                                    <button
                                        key={t.value}
                                        type="button"
                                        class={t.className}
                                        data-value={t.value}
                                        onclick={handleOptionLocalTerm}
                                        disabled={t.disabled}
                                    >
                                        {t.label}
                                    </button>
                                </template>
                            </div>
                            <div class="term-block term-end">
                                <span class="ribbon-label">End</span>
                                <span class="ribbon-value ribbon-end">{optionLocalTermEndDisplay}</span>
                            </div>
                        </div>
                    </div>
                    <div class="option-term-block">
                        <div class="option-term-row">
                            <span class="option-term-label">Billing</span>
                            <span class={optionBillingScopeClass}>{optionBillingScopeLabel}</span>
                            <span class="option-term-range">{effectiveBillingFrequency}</span>
                            <button
                                class="btn-term-action"
                                type="button"
                                onclick={handleOverrideBilling}
                                disabled={termControlsDisabled}
                                if:true={isActiveBillingShared}
                                title="Set a custom billing frequency for this option only"
                            >
                                Customize billing
                            </button>
                            <button
                                class="btn-term-action btn-term-action-muted"
                                type="button"
                                onclick={handleUseSharedBilling}
                                disabled={termControlsDisabled}
                                if:true={isActiveBillingCustom}
                                title="Reset this option to the shared ribbon billing"
                            >
                                Use shared billing
                            </button>
                        </div>
                        <p class="option-term-hint" if:true={isActiveBillingShared}>
                            Matches the ribbon. Customize to bill this option on a different cadence.
                        </p>
                        <div class="option-local-term" if:true={isActiveBillingCustom}>
                            <div class="pill-row" role="group" aria-label="Option billing frequency">
                                <template for:each={optionLocalBillingPills} for:item="b">
                                    <button
                                        key={b.value}
                                        type="button"
                                        class={b.className}
                                        data-value={b.value}
                                        onclick={handleOptionLocalBilling}
                                        disabled={b.disabled}
                                    >
                                        {b.label}
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="option-term-block option-discount-block">
                        <div class="option-term-row">
                            <span class="option-term-label">Discount</span>
                            <button
                                type="button"
                                class={lineDiscountScopeClass}
                                onclick={handleDiscountScopeLine}
                                disabled={lineInputsDisabled}
                                title="Set a discount per line in the grid below"
                            >
                                Line
                            </button>
                            <button
                                type="button"
                                class={optionDiscountScopeClass}
                                onclick={handleDiscountScopeOption}
                                disabled={lineInputsDisabled}
                                title="Apply one discount across every line in this option"
                            >
                                Option
                            </button>
                            <label class="option-disc" if:true={isDiscountScopeOption}>
                                <span class="line-control-label">Disc %</span>
                                <input
                                    class="line-disc-input"
                                    type="number"
                                    min="0"
                                    max="100"
                                    step="0.1"
                                    aria-label="Option discount percent"
                                    value={optionDiscountPercent}
                                    oninput={handleOptionDiscountInput}
                                    onfocus={handleLineEditFocus}
                                    onblur={handleLineEditBlur}
                                    disabled={lineInputsDisabled}
                                />
                            </label>
                        </div>
                        <p class="option-term-hint">
                            Line sets a % per line below. Option applies one % across
                            every line in this option.
                        </p>
                    </div>
                    <div class="option-actions">
                        <button
                            class="btn ghost small"
                            type="button"
                            onclick={handleReprice}
                            disabled={repriceDisabled}
                            title="Re-run Revenue Cloud FORCE pricing on this option"
                        >
                            Reprice
                        </button>
                        <button
                            class="btn-delete-pill"
                            type="button"
                            onclick={handleDeleteOption}
                            disabled={deleteOptionDisabled}
                            title={deleteOptionTitle}
                        >
                            Delete option
                        </button>
                    </div>
                    <template if:true={optionError}>
                        <div class="error" role="alert">{optionError}</div>
                    </template>
                    <template if:false={hasLines}>
                        <p class="empty-lines">
                            No lines yet. Pick a product from the catalog on the left.
                        </p>
                    </template>
                    <div class="line-toolbar" if:true={hasLines}>
                        <label class="line-select-all">
                            <input
                                type="checkbox"
                                checked={allLinesSelected}
                                onchange={handleToggleSelectAllLines}
                                disabled={lineInputsDisabled}
                            />
                            <span>Select all</span>
                        </label>
                        <button
                            class="btn-delete-pill"
                            type="button"
                            onclick={handleDeleteSelectedLines}
                            disabled={deleteSelectedDisabled}
                            title="Delete selected lines"
                        >
                            {deleteSelectedLabel}
                        </button>
                    </div>
                    <ul class="line-list" if:true={hasLines}>
                        <template for:each={lineDisplayRows} for:item="line">
                            <li key={line.lineId} class={line.cardClass}>
                                <div class="line-top">
                                    <label class="line-check">
                                        <input
                                            type="checkbox"
                                            data-line-id={line.lineId}
                                            data-bundle-line-ids={line.bundleLineIds}
                                            checked={line.selected}
                                            onchange={handleToggleLineSelect}
                                            disabled={lineInputsDisabled}
                                            aria-label="Select line"
                                        />
                                    </label>
                                    <div class="line-identity">
                                        <div class="line-title-row">
                                            <strong class="line-name">{line.name}</strong>
                                            <span
                                                class="bundle-chip"
                                                if:true={line.isBundleHead}
                                            >
                                                Bundle · {line.childCountLabel}
                                            </span>
                                        </div>
                                        <p class="line-subtitle">
                                            <template if:true={line.hideQtyInput}>
                                                <span class="line-qty-readonly"
                                                    >{line.quantity}</span
                                                >
                                            </template>
                                            <template if:false={line.hideQtyInput}>
                                                <input
                                                    class="line-qty"
                                                    type="number"
                                                    min="1"
                                                    aria-label="Users"
                                                    data-line-id={line.lineId}
                                                    value={line.quantity}
                                                    oninput={handleLineQtyInput}
                                                    onfocus={handleLineEditFocus}
                                                    onblur={handleLineEditBlur}
                                                    disabled={lineInputsDisabled}
                                                />
                                            </template>
                                            <span>users</span>
                                            <span
                                                class="muted"
                                                if:true={line.unitLabel}
                                                >· {line.unitLabel}/user/mo</span
                                            >
                                        </p>
                                    </div>
                                    <div class="line-list-price">
                                        <span class="line-list-label">List</span>
                                        <span class="line-list-value">{line.listLabel}</span>
                                        <span class="line-net-head" if:true={line.isBundleHead}
                                            >{line.netLabel}</span
                                        >
                                    </div>
                                </div>

                                <div class="line-controls" if:false={line.hideLineControls}>
                                    <label class="line-disc" if:true={isDiscountScopeLine}>
                                        <span class="line-control-label">Disc %</span>
                                        <input
                                            class="line-disc-input"
                                            type="number"
                                            min="0"
                                            max="100"
                                            step="0.1"
                                            aria-label="Discount percent"
                                            data-line-id={line.lineId}
                                            value={line.discountPercent}
                                            oninput={handleLineDiscountInput}
                                            onfocus={handleLineEditFocus}
                                            onblur={handleLineEditBlur}
                                            disabled={lineInputsDisabled}
                                        />
                                    </label>
                                    <span class="line-disc-readonly" if:true={isDiscountScopeOption}
                                        >{line.discountPercent}%</span
                                    >
                                    <span
                                        class={line.lineApprovalChipClass}
                                        if:true={line.showLineApprovalChip}
                                        title="This line's Disc % drives Smart Approval"
                                        >{line.approvalRequiredChipLabel}</span
                                    >
                                    <span class="line-inherited-chip">Inherited</span>
                                    <div class="line-dates">
                                        <span>{line.dateRangeLabel}</span>
                                        <span class="line-days" if:true={line.dayCountLabel}
                                            >{line.dayCountLabel}</span
                                        >
                                    </div>
                                    <span
                                        class="line-saving"
                                        if:true={line.isSaving}
                                        title="Edited — reprices when you finish with this line"
                                        >Edited</span
                                    >
                                    <span class="line-net">{line.netLabel}</span>
                                </div>
                            </li>
                        </template>
                    </ul>
                    <footer class="option-foot">
                        <div class="option-foot-row">
                            <div>
                                <span class="option-foot-label">Subscription (term)</span>
                                <span class="option-foot-meta">{subscriptionTermLabel}</span>
                            </div>
                            <span class="option-foot-amount">{subscriptionTotalLabel}</span>
                        </div>
                        <div class="option-foot-row option-foot-total">
                            <span class="option-foot-label">Grand total</span>
                            <span class="option-foot-amount">{grandTotalLabel}</span>
                        </div>
                    </footer>
                </article>
            </section>

            <aside class="col agent" if:true={agentOpen}>
                <h2 class="col-title">Quoting Assistant</h2>
                <p class="hint">
                    Chat with Quinn in Agentforce. Opening from this suite seeds the current
                    Opportunity so you do not need to paste the Id for Good / Better / Best.
                </p>
                <button
                    class="btn agent agent-open-btn"
                    type="button"
                    onclick={handleOpenAgentforce}
                    disabled={agentChatBusy}
                >
                    {agentOpenLabel}
                </button>
                <button
                    class="btn ghost agent-open-btn"
                    type="button"
                    onclick={handleAgentRefreshOptions}
                    disabled={agentRefreshDisabled}
                >
                    Refresh options
                </button>
                <p class="hint agent-tle-hint">
                    After Agentforce changes, Refresh options here. The Quote record line
                    editor may show stale qty or dates until you hard-refresh that tab.
                </p>
                <p class="agent-status" if:true={agentStatus} aria-live="polite">{agentStatus}</p>
                <div class="error" role="alert" if:true={agentError}>{agentError}</div>
            </aside>
        </div>

        <div class="boot-panel" if:true={showBootPanel}>
            <p class="hint" if:true={loading}>Opening suite…</p>
            <div class="error" role="alert" if:true={error}>{error}</div>
        </div>
    </div>
</template>
