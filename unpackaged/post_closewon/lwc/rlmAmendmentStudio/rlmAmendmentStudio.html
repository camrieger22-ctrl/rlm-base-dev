<template>
    <div class="studio">
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading Amendment Studio" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-around_medium" role="alert">
                {error}
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:false={hasQuote}>
                <div class="slds-p-around_large slds-text-align_center">
                    <p class="slds-text-heading_small">Open Amendment Studio from an amendment Quote</p>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                        Use the Open Amendment Studio button on a Quote to load difference KPIs.
                    </p>
                </div>
            </template>

            <template if:true={hasQuote}>
                <template if:true={showNonAmendBanner}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-horizontal_medium slds-m-bottom_small" role="status">
                        This Quote is not marked as an amendment. Studio still shows lines; KPIs may be empty.
                    </div>
                </template>
                <template if:true={showPricingInProgressBanner}>
                    <div class="slds-notify slds-notify_alert slds-theme_info slds-m-horizontal_medium slds-m-bottom_small" role="status">
                        {pricingInProgressMessage}
                    </div>
                </template>
                <template if:true={showPricingAttentionBanner}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-horizontal_medium slds-m-bottom_small" role="status">
                        {pricingAttentionMessage}
                    </div>
                </template>

                <!-- Left: Catalog. Right: stacked options (KPIs). Line edits → OOTB TLE below. -->
                <div class="studio-layout">
                    <section class="studio-panel layout-catalog" aria-label="Product catalog">
                        <div class="studio-panel__header studio-panel__header_stack">
                            <div>
                                <h2 class="studio-panel__title">Catalog</h2>
                                <p class="studio-panel__hint">
                                    Search and browse with Product Discovery on this quote.
                                    For full configure (bundles / attributes), use
                                    <strong>Browse Catalogs</strong> on the Quote header.
                                </p>
                            </div>
                        </div>
                        <div class="studio-panel__body studio-panel__body_catalog">
                            <div class="catalog-chip-row" role="group" aria-label="Product catalogs">
                                <template for:each={catalogChipViews} for:item="chip">
                                    <button
                                        key={chip.id}
                                        type="button"
                                        class={chip.chipClass}
                                        data-id={chip.id}
                                        aria-pressed={chip.isSelected}
                                        onclick={handleCatalogChipClick}
                                        disabled={isBusy}
                                    >
                                        {chip.name}
                                    </button>
                                </template>
                            </div>
                            <template if:true={hasCategoryChips}>
                                <div class="catalog-chip-row" role="group" aria-label="Categories">
                                    <template for:each={categoryChipViews} for:item="chip">
                                        <button
                                            key={chip.id}
                                            type="button"
                                            class={chip.chipClass}
                                            data-id={chip.id}
                                            aria-pressed={chip.isSelected}
                                            onclick={handleCategoryChipClick}
                                            disabled={isBusy}
                                        >
                                            {chip.name}
                                        </button>
                                    </template>
                                </div>
                            </template>
                            <lightning-input
                                type="search"
                                label="Search products"
                                placeholder="Search with Product Discovery…"
                                value={catalogSearchTerm}
                                onchange={handleCatalogSearchInput}
                                disabled={isBusy}
                                class="catalog-rail-search"
                            ></lightning-input>
                            <template if:true={catalogSearching}>
                                <p class="working-row__meta">Searching Product Discovery…</p>
                            </template>
                            <template if:true={catalogError}>
                                <p class="pending-error">{catalogError}</p>
                            </template>
                            <template if:true={hasCatalogResults}>
                                <p class="catalog-rail-heading">{catalogListHeading}</p>
                                <ul class="catalog-hits catalog-hits_rail" role="listbox" aria-label={catalogListHeading}>
                                    <template for:each={catalogResultViews} for:item="hit">
                                        <li key={hit.key}>
                                            <button
                                                type="button"
                                                class="catalog-hit"
                                                role="option"
                                                data-pbe-id={hit.pricebookEntryId}
                                                onclick={handleSelectRailCatalogProduct}
                                                disabled={catalogAdding}
                                            >
                                                <span class="catalog-hit__main">
                                                    <span class="catalog-hit__name">{hit.productName}</span>
                                                    <template if:true={hit.metaLine}>
                                                        <span class="catalog-hit__meta">{hit.metaLine}</span>
                                                    </template>
                                                    <template if:true={hit.descriptionLine}>
                                                        <span class="catalog-hit__desc">{hit.descriptionLine}</span>
                                                    </template>
                                                </span>
                                                <span class="catalog-hit__price">
                                                    <lightning-formatted-number
                                                        value={hit.listPrice}
                                                        format-style="currency"
                                                        currency-code="USD"
                                                    ></lightning-formatted-number>
                                                </span>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={showCatalogEmptyHint}>
                                <p class="slds-text-body_small slds-text-color_weak catalog-rail-empty">
                                    Pick a category or type to search Product Discovery.
                                </p>
                            </template>
                            <template if:true={showCatalogNoHits}>
                                <p class="slds-text-body_small slds-text-color_weak catalog-rail-empty">
                                    No Discovery matches in this catalog scope. Try All or another category.
                                </p>
                            </template>
                        </div>
                    </section>

                    <section class="studio-panel studio-panel_working layout-working" aria-label="Amendment impact">
                        <div class="tle-shell">
                            <header class="impact-toolbar">
                                <div>
                                    <h2 class="impact-toolbar__title">Contract impact</h2>
                                    <p class="impact-toolbar__meta">{impactMetaLabel}</p>
                                </div>
                                <div class="impact-toolbar__actions">
                                    <button
                                        type="button"
                                        class="tle-btn"
                                        onclick={handleRefreshProposalFigures}
                                        disabled={refreshProposalDisabled}
                                        title="Re-stamp the Quote KPIs and By product rows used by the proposal. Writes the Quote, so reload the page before editing Quote Lines again."
                                    >
                                        {refreshProposalLabel}
                                    </button>
                                    <button
                                        type="button"
                                        class="tle-btn"
                                        onclick={handleRepriceAll}
                                        disabled={isBusy}
                                        title="Force-reprice this Quote via Place Sales Transaction"
                                    >
                                        Reprice All
                                    </button>
                                </div>
                            </header>

                            <p class="impact-hint">
                                Edit quantity, discount, and dates in the <strong>Quote Lines</strong> table below — Instant Pricing updates totals as you save (no Reprice All needed for routine edits).
                                Add products from the catalog on the left, or <strong>Browse Catalogs</strong> in the header.
                                When you have finished editing, click <strong>Update proposal figures</strong> before you generate the proposal.
                            </p>

                            <div class="scenario-option__kpis impact-kpis">
                                <div class="kpi-card kpi-card_current scenario-option__kpi">
                                    <div class="kpi-card__label-row">
                                        <p class="kpi-card__label">
                                            <span class="kpi-card__badge">Current</span>
                                        </p>
                                        <button
                                            type="button"
                                            class="kpi-card__link"
                                            onclick={handleOpenInstalledDrawer}
                                            aria-expanded={installedDrawerExpanded}
                                        >
                                            View history
                                        </button>
                                    </div>
                                    <div class="kpi-card__metrics kpi-card__metrics_aligned">
                                        <button
                                            type="button"
                                            class="kpi-metric-btn"
                                            onclick={handleOpenInstalledDrawer}
                                            title="View installed ledger that rolls up to Current ARR"
                                            aria-label="Current ARR — open installed ledger"
                                        >
                                            <p class="kpi-metric__label">ARR</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={kpiCurrentArr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                            </p>
                                        </button>
                                        <button
                                            type="button"
                                            class="kpi-metric-btn"
                                            onclick={handleOpenInstalledDrawer}
                                            title="View installed ledger that rolls up to Current MRR"
                                            aria-label="Current MRR — open installed ledger"
                                        >
                                            <p class="kpi-metric__label">MRR</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={kpiCurrentMrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                            </p>
                                        </button>
                                        <button
                                            type="button"
                                            class="kpi-metric-btn"
                                            onclick={handleOpenInstalledDrawer}
                                            title="View installed ledger that rolls up to Current quantity"
                                            aria-label="Current quantity — open installed ledger"
                                        >
                                            <p class="kpi-metric__label">Qty</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={kpiCurrentQty} maximum-fraction-digits="0"></lightning-formatted-number>
                                            </p>
                                        </button>
                                        <div class="kpi-metric-spacer" aria-hidden="true"></div>
                                    </div>
                                    <template if:true={showCurrentBreakdown}>
                                        <div class="kpi-breakdown kpi-breakdown_current">
                                            <button
                                                type="button"
                                                class="kpi-breakdown__toggle"
                                                onclick={handleToggleCurrentBreakdown}
                                                aria-expanded={currentBreakdownExpanded}
                                                aria-controls="current-by-product"
                                            >
                                                {currentBreakdownToggleLabel}
                                            </button>
                                            <template if:true={currentBreakdownOpen}>
                                                <ul
                                                    id="current-by-product"
                                                    class="kpi-breakdown__list"
                                                    aria-label="Current by product"
                                                >
                                                    <template for:each={currentBreakdown} for:item="row">
                                                        <li key={row.key} class={row.rowClass}>
                                                            <span class="kpi-breakdown__name" title={row.productName}>
                                                                {row.productName}
                                                                <template if:true={row.isAmending}>
                                                                    <span class="kpi-breakdown__tag">Amending</span>
                                                                </template>
                                                            </span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">Qty</span>
                                                                <lightning-formatted-number value={row.qty} maximum-fraction-digits="0"></lightning-formatted-number>
                                                            </span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">ARR</span>
                                                                <lightning-formatted-number value={row.arr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                            </span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">MRR</span>
                                                                <lightning-formatted-number value={row.mrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                            </span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">Avg paid</span>
                                                                <template if:true={row.hasAvgPaid}>
                                                                    <lightning-formatted-number value={row.averagePaid} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                </template>
                                                                <template if:false={row.hasAvgPaid}>—</template>
                                                            </span>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="kpi-card kpi-card_add scenario-option__kpi">
                                    <p class="kpi-card__label">
                                        <span class="kpi-card__badge">This add</span>
                                    </p>
                                    <div class="kpi-card__metrics kpi-card__metrics_aligned">
                                        <div>
                                            <p class="kpi-metric__label">ARR</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={thisAddArr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                            </p>
                                        </div>
                                        <div>
                                            <p class="kpi-metric__label">MRR</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={thisAddMrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                            </p>
                                        </div>
                                        <div>
                                            <p class="kpi-metric__label">Qty</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={thisAddQty} maximum-fraction-digits="0"></lightning-formatted-number>
                                            </p>
                                        </div>
                                        <div class="kpi-metric-prorated">
                                            <p class="kpi-metric__label">Prorated</p>
                                            <p class="kpi-metric__value">
                                                <lightning-formatted-number value={thisAddProrated} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                            </p>
                                        </div>
                                    </div>
                                    <template if:true={showThisAddBreakdown}>
                                        <div class="kpi-breakdown kpi-breakdown_add">
                                            <button
                                                type="button"
                                                class="kpi-breakdown__toggle"
                                                onclick={handleToggleThisAddBreakdown}
                                                aria-expanded={thisAddBreakdownExpanded}
                                                aria-controls="this-add-by-product"
                                            >
                                                {thisAddBreakdownToggleLabel}
                                            </button>
                                            <template if:true={thisAddBreakdownOpen}>
                                                <ul
                                                    id="this-add-by-product"
                                                    class="kpi-breakdown__list"
                                                    aria-label="This add by product"
                                                >
                                                    <template for:each={thisAddBreakdown} for:item="row">
                                                        <li key={row.key} class="kpi-breakdown__row">
                                                            <span class="kpi-breakdown__name" title={row.productName}>{row.productName}</span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">Qty</span>
                                                                <lightning-formatted-number value={row.qty} maximum-fraction-digits="0"></lightning-formatted-number>
                                                            </span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">ARR</span>
                                                                <lightning-formatted-number value={row.arr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                            </span>
                                                            <span class="kpi-breakdown__metric">
                                                                <span class="kpi-breakdown__metric-label">MRR</span>
                                                                <lightning-formatted-number value={row.mrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                            </span>
                                                            <span class="kpi-breakdown__metric kpi-breakdown__metric_emphasis">
                                                                <span class="kpi-breakdown__metric-label">Prorated</span>
                                                                <lightning-formatted-number value={row.prorated} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                            </span>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="kpi-card kpi-card_finalized scenario-option__kpi" aria-label="Finalized contract">
                                    <p class="kpi-card__label">
                                        <span class="kpi-card__badge">Finalized contract</span>
                                    </p>
                                    <template if:true={showFinalizedImpact}>
                                        <div class="kpi-card__metrics kpi-card__metrics_aligned">
                                            <template for:each={impactDeltas} for:item="row">
                                                <div key={row.key} class="kpi-metric-finalized">
                                                    <p class="kpi-metric__label">{row.label}</p>
                                                    <p class="kpi-metric__value">
                                                        <template if:true={row.formatCurrency}>
                                                            <lightning-formatted-number value={row.proposed} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                        </template>
                                                        <template if:true={row.formatQty}>
                                                            <lightning-formatted-number value={row.proposed} maximum-fraction-digits="0"></lightning-formatted-number>
                                                        </template>
                                                    </p>
                                                    <p class={row.deltaClass}>
                                                        Δ
                                                        <template if:true={row.formatCurrency}>
                                                            <lightning-formatted-number value={row.delta} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                        </template>
                                                        <template if:true={row.formatQty}>
                                                            <lightning-formatted-number value={row.delta} maximum-fraction-digits="0"></lightning-formatted-number>
                                                        </template>
                                                    </p>
                                                </div>
                                            </template>
                                            <div class="kpi-metric-spacer" aria-hidden="true"></div>
                                        </div>
                                        <template if:true={showFinalizedBreakdown}>
                                            <div class="kpi-breakdown kpi-breakdown_finalized">
                                                <button
                                                    type="button"
                                                    class="kpi-breakdown__toggle"
                                                    onclick={handleToggleFinalizedBreakdown}
                                                    aria-expanded={finalizedBreakdownExpanded}
                                                    aria-controls="finalized-by-product"
                                                >
                                                    {finalizedBreakdownToggleLabel}
                                                </button>
                                                <template if:true={finalizedBreakdownOpen}>
                                                    <ul
                                                        id="finalized-by-product"
                                                        class="kpi-breakdown__list"
                                                        aria-label="Finalized by product"
                                                    >
                                                        <template for:each={finalizedBreakdown} for:item="row">
                                                            <li key={row.key} class="kpi-breakdown__row kpi-breakdown__row_finalized">
                                                                <span class="kpi-breakdown__name" title={row.productName}>{row.productName}</span>
                                                                <span class="kpi-breakdown__metric">
                                                                    <span class="kpi-breakdown__metric-label">Qty</span>
                                                                    <lightning-formatted-number value={row.qty} maximum-fraction-digits="0"></lightning-formatted-number>
                                                                    <span class={row.deltaQtyClass}>
                                                                        Δ
                                                                        <lightning-formatted-number value={row.deltaQty} maximum-fraction-digits="0"></lightning-formatted-number>
                                                                    </span>
                                                                </span>
                                                                <span class="kpi-breakdown__metric">
                                                                    <span class="kpi-breakdown__metric-label">ARR</span>
                                                                    <lightning-formatted-number value={row.arr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    <span class={row.deltaArrClass}>
                                                                        Δ
                                                                        <lightning-formatted-number value={row.deltaArr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    </span>
                                                                </span>
                                                                <span class="kpi-breakdown__metric">
                                                                    <span class="kpi-breakdown__metric-label">MRR</span>
                                                                    <lightning-formatted-number value={row.mrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    <span class={row.deltaMrrClass}>
                                                                        Δ
                                                                        <lightning-formatted-number value={row.deltaMrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    </span>
                                                                </span>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={showFinalizedImpact}>
                                        <p class="finalized-empty">Add or change lines to project the finalized contract.</p>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <template if:true={installedDrawerOpen}>
                    <div
                        class="installed-drawer-backdrop"
                        onclick={handleCloseInstalledDrawer}
                        role="presentation"
                    ></div>
                    <aside
                        class="installed-drawer"
                        role="dialog"
                        aria-modal="true"
                        aria-labelledby="installed-drawer-title"
                        onkeydown={handleInstalledDrawerKeydown}
                    >
                        <div class="installed-drawer__header">
                            <div>
                                <h2 id="installed-drawer-title" class="installed-drawer__title">Asset history</h2>
                                <p class="installed-drawer__subtitle">{installedAssetName}</p>
                            </div>
                            <lightning-button-icon
                                icon-name="utility:close"
                                alternative-text="Close asset history"
                                title="Close"
                                onclick={handleCloseInstalledDrawer}
                            ></lightning-button-icon>
                        </div>
                        <div class="installed-drawer__body">
                            <p class="studio-panel__hint">
                                Full installed footprint on this Account (Asset Actions / ASPs). Assets marked Amending are on this Quote.
                            </p>
                            <template if:true={hasHistoryRows}>
                                <ul class="asset-history-list" aria-label="Asset commercial history">
                                    <template for:each={assetHistoryCards} for:item="asset">
                                        <li key={asset.key} class={asset.cardClass}>
                                            <header class="asset-history-card__head">
                                                <div class="asset-history-card__head-main">
                                                    <h3 class="asset-history-card__title">
                                                        {asset.assetName}
                                                        <template if:true={asset.isAmending}>
                                                            <span class="kpi-breakdown__tag">Amending</span>
                                                        </template>
                                                    </h3>
                                                    <p class="asset-history-card__counts">{asset.countLabel}</p>
                                                </div>
                                                <template if:true={asset.canOpenAsset}>
                                                    <button
                                                        type="button"
                                                        class="tle-btn"
                                                        data-asset-id={asset.assetId}
                                                        onclick={handleOpenAsset}
                                                        title="Open this Asset record"
                                                        aria-label="Open Asset"
                                                    >
                                                        Open Asset
                                                    </button>
                                                </template>
                                            </header>

                                            <div class="asset-history-card__summary" aria-label="Current summary">
                                                <div>
                                                    <p class="txn-label">Avg paid</p>
                                                    <p class="txn-value">
                                                        <template if:true={asset.hasAveragePaid}>
                                                            <lightning-formatted-number value={asset.averagePaid} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                        </template>
                                                        <template if:false={asset.hasAveragePaid}>—</template>
                                                    </p>
                                                </div>
                                                <div>
                                                    <p class="txn-label">Current qty</p>
                                                    <p class="txn-value">
                                                        <template if:true={asset.hasCurrentQty}>
                                                            <lightning-formatted-number value={asset.currentQty} maximum-fraction-digits="0"></lightning-formatted-number>
                                                        </template>
                                                        <template if:false={asset.hasCurrentQty}>—</template>
                                                    </p>
                                                </div>
                                                <div>
                                                    <p class="txn-label">Current MRR</p>
                                                    <p class="txn-value">
                                                        <template if:true={asset.hasCurrentMrr}>
                                                            <lightning-formatted-number value={asset.currentMrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                        </template>
                                                        <template if:false={asset.hasCurrentMrr}>—</template>
                                                    </p>
                                                </div>
                                                <div>
                                                    <p class="txn-label">Current ARR</p>
                                                    <p class="txn-value">
                                                        <template if:true={asset.hasCurrentArr}>
                                                            <lightning-formatted-number value={asset.currentArr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                        </template>
                                                        <template if:false={asset.hasCurrentArr}>—</template>
                                                    </p>
                                                </div>
                                            </div>

                                            <template if:true={asset.hasTimeline}>
                                                <p class="asset-history-card__timeline-label">Transaction timeline</p>
                                                <ul class="txn-list" aria-label="Transaction timeline">
                                                    <template for:each={asset.timeline} for:item="row">
                                                        <li key={row.key} class="txn-card">
                                                            <div class="txn-card__head">
                                                                <span class="txn-card__type">{row.typeLabel}</span>
                                                                <template if:true={row.qtyDeltaLabel}>
                                                                    <span class="txn-card__delta">Qty {row.qtyDeltaLabel}</span>
                                                                </template>
                                                            </div>
                                                            <div class="txn-card__grid txn-card__grid_installed">
                                                                <div>
                                                                    <p class="txn-label">Start date</p>
                                                                    <p class="txn-value">{row.startDateLabel}</p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">End date</p>
                                                                    <p class="txn-value">{row.endDateLabel}</p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">List price</p>
                                                                    <p class="txn-value">
                                                                        <lightning-formatted-number value={row.listPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    </p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">What they paid</p>
                                                                    <p class="txn-value">
                                                                        <lightning-formatted-number value={row.netUnitPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    </p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">Discount</p>
                                                                    <p class="txn-value">
                                                                        <template if:true={row.hasDiscount}>
                                                                            <lightning-formatted-number value={row.discountPercent} maximum-fraction-digits="1"></lightning-formatted-number>%
                                                                        </template>
                                                                        <template if:false={row.hasDiscount}>—</template>
                                                                    </p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">Qty purchased</p>
                                                                    <p class="txn-value">
                                                                        <lightning-formatted-number value={row.lineQty} maximum-fraction-digits="0"></lightning-formatted-number>
                                                                    </p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">ARR</p>
                                                                    <p class="txn-value">
                                                                        <lightning-formatted-number value={row.arr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    </p>
                                                                </div>
                                                                <div>
                                                                    <p class="txn-label">MRR</p>
                                                                    <p class="txn-value">
                                                                        <lightning-formatted-number value={row.mrr} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                            <template if:false={asset.hasTimeline}>
                                                <p class="slds-text-body_small slds-text-color_weak slds-p-around_xx-small">
                                                    No Asset Actions found for this asset yet.
                                                </p>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={hasHistoryRows}>
                                <p class="slds-text-body_small slds-text-color_weak">{historyMessage}</p>
                            </template>
                        </div>
                    </aside>
                </template>
            </template>
        </template>
    </div>
</template>
