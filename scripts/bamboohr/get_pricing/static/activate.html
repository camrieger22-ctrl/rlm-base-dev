<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activate BambooHR</title>
  <link rel="icon" href="/static/brand/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v=wizard27" />
  <link rel="stylesheet" href="/static/agent-chat.css?v=wizard23" />
</head>
<body class="activate-page">
  <header class="site-header">
    <a class="logo-link" href="/" aria-label="BambooHR home">
      <img class="logo-wordmark" src="/static/brand/wordmark-green.png" alt="bambooHR" />
    </a>
    <div class="header-right">
      <nav class="site-nav">
        <a href="/account">Licenses &amp; billing</a>
      </nav>
    </div>
  </header>

  <section class="activate-hero">
    <p class="eyebrow">You're in</p>
    <h1>Activate BambooHR</h1>
    <p class="lede" id="activateLede">
      A short checklist to go from paid to productive this week.
    </p>
    <p class="activate-clock" id="activateClock" hidden></p>
    <p class="activate-needs" id="activateNeeds" hidden></p>
  </section>

  <main class="activate-shell">
    <section class="activate-proof" id="customerProof" hidden>
      <p class="activate-proof-kicker">You're a customer</p>
      <ul class="activate-proof-list" id="customerProofList"></ul>
    </section>

    <article class="activate-card">
      <div class="activate-aha-head">
        <h2 id="ahaTitle">Get value this week</h2>
        <p class="status" id="activateStatus" role="status">Loading your checklist…</p>
      </div>
      <div class="activate-progress" id="activateProgress" hidden>
        <div class="activate-progress-bar" id="activateProgressBar"></div>
      </div>
      <ol class="activate-steps" id="activateSteps"></ol>
      <div class="activate-actions">
        <a class="button-link quote-cta" id="licensesCta" href="/account">Skip to Licenses &amp; billing</a>
        <a class="button-link secondary" id="newEstimateLink" href="/">New estimate</a>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span id="activateFooterNote">Each step writes to your Salesforce Account</span>
      <a href="/account">Licenses &amp; billing</a>
    </div>
  </footer>

  <script src="/static/activate.js?v=wizard27"></script>
  <script src="/static/agent-chat.js?v=wizard27"></script>
</body>
</html>
