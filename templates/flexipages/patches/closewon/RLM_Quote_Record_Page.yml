feature: closewon
feature_flag: closewon
# 1) Amendment Studio above the Progress Indicator, shown only on Amend Quotes.
# 2) Link Opportunity in Quote highlights next to Browse Catalog.
# 3) Hide OOTB Progress Indicator on Amend Quotes — it RefreshEvent-reloads the
#    page during Instant Pricing, which turns Instant Pricing off and surfaces
#    the "outdated quote / refresh" prompt under QLE edits.
# 4) Difference quoting section exposing the RLM_Amend_* KPI stamps.
patches:
  - type: add_component
    region: Facet-52d27c4f-406f-43ea-a233-ce73598e4677
    component: rlmAmendmentStudio
    identifier: rlm_amendment_studio
    before_identifier: runtime_revenue_foundation_progressIndicator

  - type: set_component_visibility
    identifier: rlm_amendment_studio
    visibility:
      - field: Record.OriginalActionType
        operator: EQUAL
        value: Amend

  - type: insert_action
    after: "BrowseCatalog"
    actions:
      - "Quote.RLM_Link_Opportunity"

  # Keep Link Opportunity on the button bar instead of the overflow menu.
  - type: set_component_property
    identifier: force_highlightsPanel
    property: numVisibleActions
    value: "6"

  - type: set_component_visibility
    identifier: runtime_revenue_foundation_progressIndicator
    visibility:
      - field: Record.OriginalActionType
        operator: NE
        value: Amend

  - type: add_component
    region: detailTabContent
    component: flexipage:fieldSection
    identifier: flexipage_fieldSection_amend_diff
    after_identifier: flexipage_fieldSection2
    properties:
      columns: Facet-rlm-amend-diff-columns
      horizontalAlignment: "true"
      label: Difference quoting

  # Facet regions backing the Difference quoting section. No semantic patch op
  # creates a whole flexiPageRegion, so these go in as raw XML.
  - type: insert_after_xml
    anchor: "<name>Facet-faedd9c7-e69c-4942-80db-ac3fd24d69c7</name>\n        <type>Facet</type>\n    </flexiPageRegions>"
