feature: closewon
feature_flag: closewon
# 1) Amendment Studio full-bleed under highlights when OriginalActionType = Amend
#    (primary AE workspace after Managed Asset Viewer → initiateAmendment).
# 2) Hide classic TLE + transaction summary on Amend Quotes so Studio is the
#    default commercial surface (Advanced line editor remains as escape hatch).
# 3) Difference quoting field section on Details (Current / Proposed / Net Increase).
#    Field sections support at most 2 columns — Current | Proposed+Net.
#
# Anchor must match ElementTree's post-indent serialization (see AssembleAndDeployUX
# _apply_raw_xml_patch). Use an escaped string so YAML does not collapse relative indents.
patches:
  - type: insert_after_xml
    anchor: "<identifier>force_highlightsPanel</identifier>\n            </componentInstance>\n        </itemInstances>"
    xml: |
      <itemInstances>
          <componentInstance>
              <componentName>rlmAmendmentStudio</componentName>
              <identifier>rlm_amendment_studio</identifier>
              <visibilityRule>
                  <criteria>
                      <leftValue>{!Record.OriginalActionType}</leftValue>
                      <operator>EQUAL</operator>
                      <rightValue>Amend</rightValue>
                  </criteria>
              </visibilityRule>
          </componentInstance>
      </itemInstances>

  # Studio-first Amend: keep OOTB line table / summary for new-sale Quotes only.
  - type: set_component_visibility
    identifier: runtime_rca_salesTxnLineTable
    visibility:
      - field: Record.OriginalActionType
        operator: NE
        value: Amend

  - type: set_component_visibility
    identifier: runtime_revenue_foundation_transactionSummary
    visibility:
      - field: Record.OriginalActionType
        operator: NE
        value: Amend

  # Facets for the Difference quoting field section (inserted before Address Information).
  - type: insert_after_xml
    anchor: "<name>Facet-faedd9c7-e69c-4942-80db-ac3fd24d69c7</name>\n        <type>Facet</type>\n    </flexiPageRegions>"
    xml: |
      <flexiPageRegions>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Current_ARR__c</fieldItem>
                  <identifier>RecordRLM_Amend_Current_ARR_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Current_MRR__c</fieldItem>
                  <identifier>RecordRLM_Amend_Current_MRR_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Current_Qty__c</fieldItem>
                  <identifier>RecordRLM_Amend_Current_Qty_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <name>Facet-rlm-amend-current</name>
          <type>Facet</type>
      </flexiPageRegions>
      <flexiPageRegions>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Proposed_ARR__c</fieldItem>
                  <identifier>RecordRLM_Amend_Proposed_ARR_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Proposed_MRR__c</fieldItem>
                  <identifier>RecordRLM_Amend_Proposed_MRR_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Proposed_Qty__c</fieldItem>
                  <identifier>RecordRLM_Amend_Proposed_Qty_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
                  <fieldItem>Record.RLM_Amend_Net_Increase_ARR__c</fieldItem>
                  <identifier>RecordRLM_Amend_Net_Increase_ARR_cField</identifier>
              </fieldInstance>
          </itemInstances>
          <itemInstances>
              <fieldInstance>
                  <fieldInstanceProperties>
                      <name>uiBehavior</name>
                      <value>readonly</value>
                  </fieldInstanceProperties>
