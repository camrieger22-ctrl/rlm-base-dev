feature: closewon
feature_flag: closewon
# 1) Link Opportunity in Quote highlights next to Browse Catalog.
# 2) Hide OOTB Progress Indicator on Amend Quotes — it RefreshEvent-reloads the
#    page during Instant Pricing, which turns Instant Pricing off and surfaces
#    the "outdated quote / refresh" prompt under QLE edits.
#
# Note: Amendment Studio placement patches for this page also live in committed
# post_ux (patch file was emptied during Studio iteration). Restore Studio
# placement from git history before relying on assemble alone for Studio.
patches:
  - type: insert_action
    after: "BrowseCatalog"
    actions:
      - "Quote.RLM_Link_Opportunity"

  - type: set_component_visibility
    identifier: runtime_revenue_foundation_progressIndicator
    visibility:
      - field: Record.OriginalActionType
        operator: NE
        value: Amend
