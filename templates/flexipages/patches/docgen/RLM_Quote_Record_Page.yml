feature: docgen
feature_flag: docgen
# Adds proposal creation action and approval tracking fields.
# When combined with the approvals patch, the RLM_Submit_for_Approval and
# approval field inserts are no-ops (de-duplicated automatically).
patches:
  - type: insert_action
    after: "CreateRampSchedule"
    actions:
      - "Quote.RLM_Create_Proposal"
      - "Quote.RLM_Submit_for_Approval"

  # Idempotent with approvals patch; stamped flag (TLE skips formula fields)
  - type: add_sales_txn_line_editor_field
    property: displayFields
    after: "QuoteLineItem.Discount"
    fields:
      - "QuoteLineItem.RLM_Approval_Flag__c"

  - type: add_facet_field
    facet: "Quote Information"
    after: "Description"
    fields:
      - "RLM_Approval_Status__c"
      - "RLM_Payment_Terms__c"

  - type: add_facet_field
    facet: "System Information"
    after: "ValidationResult"
    fields:
      - "RLM_Approval_Level__c"
